<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>سنام — مقارنة الاتجاهات الثلاثة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Amiri:wght@700&family=Reem+Kufi:wght@500;700&family=Alexandria:wght@400;500;700;800&family=Aref+Ruqaa:wght@700&family=Readex+Pro:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../assets/kit.css">
<style>
body{background:#fff;color:#1d1b18;font-family:'IBM Plex Sans Arabic',sans-serif;--r:6px;--ink:#1d1b18;--paper:#fff;--a:#b5482a}
.top{display:flex;justify-content:space-between;align-items:center;padding:22px 28px;font-size:14px}
.top a{text-decoration:none;font-weight:600}
h1{font-family:'Amiri',serif;font-size:clamp(36px,5vw,58px);margin:40px 28px 6px;line-height:1.2}
.sub{margin:0 28px 40px;color:#6b665e}
.table{display:grid;grid-template-columns:150px repeat(3,minmax(260px,1fr));overflow-x:auto;border-top:1px solid #e7e3dc}
.table>div{padding:22px 18px;border-bottom:1px solid #e7e3dc;display:flex;align-items:center;justify-content:center}
.rl{justify-content:flex-start!important;font-weight:700;font-size:15px;color:#6b665e;position:sticky;inset-inline-start:0;background:#fff;z-index:2}
.hd{display:flex;flex-direction:column;align-items:center;gap:2px;position:sticky;top:0;background:#fff;z-index:3}
.hd b{font-size:20px}.hd a{font-size:14px}
.cell-logo svg{width:100%;max-width:260px}
.pal{display:flex;width:100%;height:70px;border-radius:6px;overflow:hidden}
.pal i{flex:1}.pal i:first-child{flex:2.4}
.ty{font-size:56px;line-height:1.2}
.ph{width:230px}
.ph .phone{max-width:230px}
.cell-dark{border-radius:6px}
.tg{font-size:20px;text-align:center}
</style>
</head>
<body>
<header class="top"><a href="../">← كل الاتجاهات</a><span>سنام · المقارنة</span></header>
<h1>الاتجاهات الثلاثة جنبًا إلى جنب</h1>
<p class="sub">كل صف يعرض العنصر نفسه في الاتجاهات الثلاثة. اسحب أفقيًا على الشاشات الصغيرة.</p>
<div class="table" id="t"></div>
<script src="../assets/brands.js"></script>
<script src="../assets/kit.js"></script>
<script>
(function () {
  const B = window.BRANDS, K = window.Kit, ids = window.BRAND_ORDER;
  const rows = [
    ['', b => `<div class="hd"><b style="font-family:${b.fonts.display};color:${b.id === 'seen' ? b.c.ink : b.c.p}">${b.letter} · ${b.name}</b><a href="../${b.id}/">افتح الاتجاه كاملًا</a></div>`, 'hd'],
    ['الشعار', b => `<div class="cell-logo">${K.logo(b, 2, b.id === 'seen' ? b.c.ink : b.c.p, b.c.a, 'c1' + b.id)}</div>`],
    ['على الداكن', b => `<div class="cell-logo cell-dark" style="background:${b.c.p};padding:28px 22px;width:100%">${K.logo(b, 2, b.c.paper, b.c.a, 'c2' + b.id)}</div>`],
    ['الرمز', b => `<div style="width:110px">${b.logos[1].render({ fg: b.id === 'seen' ? b.c.ink : b.c.p, ac: b.c.a, k: 'c3' + b.id, bgOn: b.c.paper })}</div>`],
    ['الألوان', b => `<div class="pal">${b.swatches.map(s => `<i style="background:${s[1]}" title="${s[0]} ${s[1]}"></i>`).join('')}</div>`],
    ['الخط', b => `<div style="text-align:center"><div class="ty" style="font-family:${b.fonts.display};font-weight:700;color:${b.id === 'seen' ? b.c.ink : b.c.p}">سنام</div><small>${b.fonts.displayName} + ${b.fonts.bodyName}</small></div>`],
    ['الشعار اللفظي', b => `<div class="tg" style="font-family:${b.fonts.display}">${b.tagline}</div>`],
    ['الشاشة التعريفية', b => `<div class="ph">${K.phone(K.screenOnboard(b, 0))}</div>`],
    ['التطبيق', b => `<div class="ph">${K.phone(K.screenHome(b))}</div>`],
    ['سهم الخير', b => `<div class="ph">${K.phone(K.screenSadaqa(b))}</div>`],
    ['نقاط سنام', b => `<div class="ph">${K.phone(K.screenLoyalty(b))}</div>`],
    ['الكرتونة', b => K.box(b, 270)],
    ['السيارة', b => K.van(b, 290)],
  ];
  let html = '';
  rows.forEach(([label, f]) => {
    html += `<div class="rl">${label}</div>`;
    ids.forEach(id => {
      const b = B[id];
      html += `<div style="${['--p', '--a', '--paper', '--soft', '--ink', '--x'].map((v, i) => `${v}:${[b.c.p, b.c.a, b.c.paper, b.c.soft, b.c.ink, b.c.x][i]}`).join(';')};--fb:${b.fonts.body};--fd:${b.fonts.display};--r:${b.radius}px">${f(b)}</div>`;
    });
  });
  document.getElementById('t').innerHTML = K.ROUGH + html;
})();
</script>
</body>
</html>
