<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#4A1014">
<title>سنام — نموذج التطبيق · التصميم الثاني</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Aref+Ruqaa:wght@400;700&family=El+Messiri:wght@600;700&family=Cinzel:wght@700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="studio">
  <aside class="side">
    <div class="brandline"><img src="../img/emblem.svg" width="44" height="42" alt=""><div><b>سنام</b><small>نموذج التطبيق · التصميم الثاني</small></div></div>
    <nav class="idx" id="idx" aria-label="فهرس الشاشات"></nav>
  </aside>
  <main class="stage">
    <div class="toolbar"><span class="count" id="count"></span><button id="restart">ابدأ من الأول</button><button id="all">عرض كل الشاشات</button></div>
    <div class="device" id="device"><div class="app" id="app"></div></div>
  </main>
  <aside class="side notes">
    <div id="notes"></div>
    <div class="credit" style="margin-top:30px">
      <b style="color:var(--ink2)">طريقة الاستخدام</b><br>اضغط داخل التطبيق كأنه جوالك، أو اختر أي شاشة من الفهرس. الأسهم ← → تنقلك بين الشاشات.<br><br>
      الصور من <a href="https://unsplash.com/license" target="_blank" rel="noopener">Unsplash</a> (مجانية للاستخدام التجاري) لأغراض العرض، وتُستبدل بتصوير سنام الفعلي. الأسعار والأسماء توضيحية.
    </div>
  </aside>
</div>
<section class="wall" id="wall"><div class="wall-top"><div class="brandline" style="margin:0"><div><b>سنام</b><small>كل شاشات التطبيق · التصميم الثاني</small></div></div><div class="toolbar"><button id="closeAll">رجوع للنموذج</button></div></div><div class="wall-body"></div></section>
<script src="app.js"></script>
</body>
</html>
